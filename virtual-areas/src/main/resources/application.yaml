spring:
  application:
    name: virtual-ms-java
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mariadb://${MARIADB_HOST:localhost}:3306/virtual_areas
    username: ${MARIADB_USER:virtual_areas}
    # dev default kept for the local compose; override via MARIADB_PASSWORD outside dev
    password: ${MARIADB_PASSWORD:tcc-virtual-areas}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  grpc:
    server:
      port: 50052
    client:
      channel:
        event-hub:
          # EVENTHUB_HOST / EVENTHUB_PORT kept for docker-compose compatibility
          target: static://${EVENTHUB_HOST:localhost}:${EVENTHUB_PORT:50051}
          keepalive:
            time: 60s
            timeout: 10s
            without-calls: false

server:
  port: 8082

eventhub:
  grpc:
    channel: event-hub
    deadline: ${EVENTHUB_DEADLINE:2s}
    reconnect-initial-backoff: 1s
    reconnect-max-backoff: 30s

virtual-areas:
  dispatch:
    # max wait for event-hub + InfluxDB side effects of one transition
    timeout: ${DISPATCH_TIMEOUT:5s}

influxdb:
  url: ${INFLUXDB_URL:http://localhost:8086}
  # dev default kept for the local compose; override via INFLUXDB_TOKEN outside dev
  token: ${INFLUXDB_TOKEN:tcc-local-super-secret-token}
  org: ${INFLUXDB_ORG:tcc-org}
  bucket: ${INFLUXDB_BUCKET:projections}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

vaadin:
  push-mode: AUTOMATIC
  launch-browser: false
  production-mode: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
